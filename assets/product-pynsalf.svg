<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800" width="640" height="800" role="img" aria-label="PS PynSalf pain relief ointment jar">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdfaf4"/>
      <stop offset="100%" stop-color="#efe4d3"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#16392d"/>
      <stop offset="28%" stop-color="#26604a"/>
      <stop offset="70%" stop-color="#2c6a53"/>
      <stop offset="100%" stop-color="#122f25"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8f4d20"/>
      <stop offset="30%" stop-color="#c8873c"/>
      <stop offset="72%" stop-color="#b4652a"/>
      <stop offset="100%" stop-color="#7d431b"/>
    </linearGradient>
    <linearGradient id="label" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffdf8"/>
      <stop offset="100%" stop-color="#f6efe2"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity=".05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity=".14"/>
    </linearGradient>
    <radialGradient id="psBadge" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0%" stop-color="#2c6a53"/>
      <stop offset="100%" stop-color="#16392d"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="640" height="800" fill="url(#bg)"/>
  <ellipse cx="320" cy="672" rx="184" ry="26" fill="#d9cbb6" opacity=".65" filter="url(#soft)"/>

  <!-- ================= LID ================= -->
  <rect x="206" y="196" width="228" height="34" rx="10" fill="#7d431b" opacity=".35"/>
  <rect x="210" y="186" width="220" height="40" rx="12" fill="url(#lid)"/>
  <rect x="210" y="222" width="220" height="12" rx="6" fill="#6f3a15" opacity=".38"/>
  <!-- knurled ridges -->
  <g fill="#ffffff" opacity=".16">
    <rect x="228" y="192" width="7" height="30" rx="3.5"/>
    <rect x="252" y="192" width="7" height="30" rx="3.5"/>
    <rect x="276" y="192" width="7" height="30" rx="3.5"/>
    <rect x="300" y="192" width="7" height="30" rx="3.5"/>
    <rect x="324" y="192" width="7" height="30" rx="3.5"/>
    <rect x="348" y="192" width="7" height="30" rx="3.5"/>
    <rect x="372" y="192" width="7" height="30" rx="3.5"/>
    <rect x="396" y="192" width="7" height="30" rx="3.5"/>
  </g>

  <!-- ================= JAR BODY ================= -->
  <rect x="224" y="228" width="192" height="404" rx="26" fill="url(#body)"/>
  <rect x="224" y="228" width="192" height="404" rx="26" fill="url(#glass)"/>
  <!-- shoulder highlight -->
  <rect x="240" y="240" width="26" height="380" rx="13" fill="#ffffff" opacity=".10"/>

  <!-- ================= LABEL ================= -->
  <rect x="244" y="268" width="152" height="316" rx="14" fill="url(#label)"/>
  <rect x="244" y="268" width="152" height="316" rx="14" fill="none" stroke="#c8873c" stroke-width="2.5" opacity=".5"/>

  <!-- PS badge -->
  <circle cx="320" cy="330" r="42" fill="url(#psBadge)"/>
  <text x="320" y="330" text-anchor="middle" dominant-baseline="central"
        font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="700"
        letter-spacing="1" fill="#fdfaf4">PS</text>

  <!-- leaf accent inside badge bottom -->
  <path d="M320 372c7 5 10 10 10 15a10 10 0 0 1-20 0c0-5 3-10 10-15Z" fill="#c8873c"/>

  <!-- wordmark -->
  <text x="320" y="424" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700"
        letter-spacing="1.5" fill="#16392d">PYNSALF</text>

  <!-- rule -->
  <rect x="278" y="440" width="84" height="2" rx="1" fill="#c8873c"/>

  <!-- natural ingredients -->
  <text x="320" y="466" text-anchor="middle"
        font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15"
        letter-spacing="0.6" fill="#3f6b56">Natural Ingredients</text>

  <!-- divider -->
  <rect x="272" y="486" width="96" height="1" fill="#ddd0ba"/>

  <!-- topical body care -->
  <text x="320" y="510" text-anchor="middle"
        font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12"
        font-weight="700" letter-spacing="2.4" fill="#8a8175">TOPICAL</text>
  <text x="320" y="528" text-anchor="middle"
        font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12"
        font-weight="700" letter-spacing="2.4" fill="#8a8175">BODY CARE</text>

  <!-- jar base -->
  <rect x="238" y="616" width="164" height="18" rx="9" fill="#0d251c" opacity=".28"/>

  <!-- ================= SIDE CALLOUT ================= -->
  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="320" y="112" font-size="26" font-weight="700" letter-spacing="3.5" fill="#16392d">PS PYNSALF</text>
    <text x="320" y="146" font-size="15" letter-spacing="1.6" fill="#8a8175">EVERYDAY BODY CARE</text>
  </g>
</svg>