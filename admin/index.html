<!doctype html>
<html lang="en-ZA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
  <title>Private admin | PS PynSalf</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fbf8f3;color:#23302b;font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
    main{width:min(480px,calc(100% - 36px));padding:28px;background:#fff;border:1px solid #e6dacb;border-radius:14px;box-shadow:0 6px 24px #14372c12}
    h1{color:#14372c;font-size:1.5rem;margin:0 0 12px}p{margin:0;color:#55635c}a{display:inline-block;margin-top:20px;padding:11px 16px;background:#1f4d3d;color:#fff;border-radius:9px;text-decoration:none;font-weight:700}
    #state{margin-top:14px;font-size:.93rem}
  </style>
</head>
<body>
  <main>
    <h1>Private PS PynSalf dashboard</h1>
    <p>This dashboard is hosted separately from the public website and requires secure server-side sign-in.</p>
    <p id="state" role="status">Checking the secure dashboard connection…</p>
    <a id="open" href="#" hidden>Continue to secure sign-in</a>
  </main>
  <script src="../js/admin-config.js"></script>
  <script src="../js/admin-redirect.js"></script>
</body>
</html>
