name = "pynsalf-private-analytics"
main = "src/index.js"
compatibility_date = "2026-10-02"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[vars]
SITE_ORIGIN = "https://leesetzkorn-maker.github.io"
RETENTION_DAYS = "400"
ENVIRONMENT = "production"

[[d1_databases]]
binding = "DB"
database_name = "pynsalf-analytics"
database_id = "caca79d1-4591-470d-8e7d-fda34a71d0a5"

[triggers]
crons = ["17 0 * * *"]
